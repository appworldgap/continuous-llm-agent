<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Latest Breakthroughs in Technology</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --primary: #4a90e2;
  --secondary: #f5f5f5;
  --accent: #ff5a5f;
  --text-primary: #222;
  --text-secondary: #555;
  --bg: #fff;
  --card-bg: #fafafa;
  --border-radius: 8px;
}
body {
  margin: 0;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
}
header {
  background: var(--primary);
  color: #fff;
  padding: 2rem 1rem;
  text-align: center;
}
header h1 {
  margin: 0;
  font-size: 2.5rem;
}
main {
  padding: 2rem 1rem;
  max-width: 1200px;
  margin: auto;
}
section#breakthroughs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1.5rem;
}
.card {
  background: var(--card-bg);
  border-radius: var(--border-radius);
  box-shadow: 0 4px 6px rgba(0,0,0,0.08);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  height: 100%;
}
.card h3 {
  margin-top: 0;
  color: var(--primary);
}
.card p {
  flex-grow: 1;
}
.card .read-more {
  margin-top: 1rem;
  text-decoration: none;
  color: var(--accent);
  font-weight: bold;
}
footer {
  text-align: center;
  padding: 1rem;
  font-size: 0.9rem;
  color: var(--text-secondary);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --card-bg: #1e1e1e;
    --primary: #90caf9;
    --accent: #ff8a80;
    --text-primary: #e0e0e0;
    --text-secondary: #aaa;
  }
}
</style>
</head>
<body>

  <h1>Latest Breakthroughs in Technology</h1>
  <p>Discover the cutting‑edge innovations shaping our future.</p>
</header>
