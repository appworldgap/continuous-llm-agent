<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Latest Breakthroughs in Technology – 2024</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* CSS Variables */
  :root {
    --primary: #1d4ed8;
    --accent: #ff6363;
    --bg: #f9fafb;
    --text: #111827;
    --card-bg: #ffffff;
    --border-radius: 0.75rem;
    --transition: 0.3s ease;
    --font-base: 1rem;
    --font-heading: 2.25rem;
    --font-subheading: 1.5rem;
  }

  /* Base Reset */
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body, h1, h2, h3, p, ul, li, a, figure, figcaption {
    margin: 0;
    padding: 0;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.6;
    background: var(--bg);
    color: var(--text);
    font-size: var(--font-base);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Layout */
  .container {
    max-width: 1200px;
    margin: auto;
    padding: 2rem 1rem;
    flex: 1;
  }
  header { text-align: center; margin-bottom: 2rem; }
  header h1 { font-size: var(--font-heading); margin-bottom: 0.5rem; }
  header p { color: #6b7280; }

  /* Grid of cards */
  .grid {
    display: grid;
    gap: 1.5rem;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  }
  .card {
    background: var(--card-bg);
    border-radius: var(--border-radius);
    box-shadow: 0 4px 6px rgba(0,0,0,.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform var(--transition), box-shadow var(--transition);
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 12px rgba(0,0,0,.12); }

  .card img { width: 100%; height: 180px; object-fit: cover; }
  .card-content { padding: 1rem; flex: 1; display: flex; flex-direction: column; }
  .card-content h3 { margin-bottom: 0.5rem; font-size: var(--font-subheading); }
  .card-content p { flex: 1; margin-bottom: 0.75rem; color: #4b5563; }
  .card-content .meta { font-size: 0.875rem; color: #6b7280; margin-bottom: 0.5rem; }
  .card-content .btn {
    display: inline-block;
    margin-top: auto;
    padding: 0.5rem 1rem;
    background: var(--primary);
    color: #fff;
    border-radius: 9999px;
    text-align: center;
    font-weight: 600;
    transition: background var(--transition);
  }
  .card-content .btn:hover { background: #1e40af; }

  footer {
    text-align: center;
    padding: 1.5rem 1rem;
    font-size: 0.875rem;
    background: #fff;
    border-top: 1px solid #e5e7eb;
  }
  footer a { color: var(--primary); }
  footer a:hover { text-decoration: underline; }

  /* Responsive tweaks */
  @media (min-width: 1024px) {
    header h1 { font-size: 3rem; }
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <h1>Latest Breakthroughs in Technology – 2024</h1>
    <p>From AI to quantum computing, these are the most transformative advances that are reshaping the world.</p>
  </header>

  <section class="grid">

    <!-- 1. AI -->
    <article class="card">
      <img src="https://images.unsplash.com/photo-1587620962725-abab7f1e2d85?auto=format&fit=crop&w=800&q=80" alt="AI concept">
      <div class="card-content">
        <h3>OpenAI GPT‑4 Turbo 128k</h3>
        <div class="meta">Jan 2024 • Artificial Intelligence</div>
        <p>GPT‑4 Turbo now offers a 128,000‑token context window
