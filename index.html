<style>
:root {
  --primary: #0052cc;
  --accent: #ff6b6b;
  --bg: #fafafa;
  --card-bg: #ffffff;
  --text: #333333;
  --light: #f0f0f0;
  --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
header {
  background: var(--primary);
  color: #fff;
  padding: 2rem 1rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
header h1 {
  font-size: 2.5rem;
  font-weight: 600;
}
header .wave {

}
section {
  max-width: 1200px;
  margin: 2rem auto;
  padding: 0 1rem;
}
h2 {
  text-align: center;
  margin-bottom: 1.5rem;
  font-size: 2rem;
  color: var(--primary);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem;
}
.card {
  background: var(--card-bg);
  border-radius: 8px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform .2s, box-shadow .2s;
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 8px 20px rgba(0,0,0,.12);
}
.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}
.card-body {
  padding: 1rem;
  flex: 1 0 auto;
}
.card-title {
  font-size: 1.25rem;
  margin-bottom: .5rem;
  color: var(--primary);
}
.card-text {
  font-size: .95rem;
  color: var(--text);
}
.card-footer {
  padding: 0 1rem 1rem;
  text-align: right;
}
.card-footer a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}
footer {
  background: var(--light);
  text-align: center;
  padding: 1rem 0;
  margin-top: 3rem;
  color: var(--text);
  font-size: .9rem;
}
@media (max-width: 600px) {
  header h1 { font-size: 2rem; }
  h2 { font-size: 1.75rem; }
}
</style>
</head>
