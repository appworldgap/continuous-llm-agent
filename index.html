<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Latest Breakthroughs in Technology</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body{
        font-family:Arial,Helvetica,sans-serif;
        background:#f8f9fa;
        margin:0;
        padding:0;
        color:#333;
    }
    header{
        background:#343a40;
        color:white;
        padding:2rem 1rem;
        text-align:center;
    }
    h1{
        margin:0;
        font-size:2.5rem;
    }
    main{
        max-width:1200px;
        margin:auto;
        padding:2rem;
    }
    section{
        margin-bottom:2rem;
    }
    .cards{
        display:flex;
        flex-wrap:wrap;
        gap:1rem;
    }
    .card{
        background:white;
        border-radius:8px;
        box-shadow:0 2px 5px rgba(0,0,0,.1);
        overflow:hidden;
        flex:1 1 calc(50% - 1rem);
        transition:transform .2s;
    }
    .card:hover{
        transform:scale(1.02);
    }
    .card img{
        width:100%;
        height:auto;
    }
    .card-body{
        padding:1.5rem;
    }
    .card-title{
        font-size:1.25rem;
        margin:0 0 .5rem;
    }
    .card-text{
        font-size:1rem;
        line-height:1.5;
    }
    footer{
        background:#e9ecef;
        color:#6c757d;
        text-align:center;
        padding:1rem;
    }
    @media (min-width:768px){
        .card{
            flex:1 1 calc(50% - 1rem);
        }
    }
    @media (min-width:992px){
        .card{
            flex:1 1 calc(33.333% - 1rem);
        }
    }
</style>
</head>
<body>
<header>
    <h1>Latest Breakthroughs in Technology</h1>
</header>
<main>
    <section>
        <h2>Artificial Intelligence</h2>
        <div class="cards">
            <div class="card">
                <img src="https://source.unsplash.com/600x400/?ai" alt="AI">
                <div class="card-body">
                    <h3 class="card-title">Generative AI Models</
