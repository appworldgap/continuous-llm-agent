<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Latest Breakthroughs in Technology</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'Inter',sans-serif;
    margin:0;
    padding:0;
    background:#f9f9f9;
    color:#333;
  }
  header{
    background:#fff;
    padding:20px 0;
    border-bottom:1px solid #e0e0e0;
  }
  .container{
    max-width:1200px;
    margin:auto;
    padding:0 15px;
  }
  nav a{
    color:#333;
    text-decoration:none;
    margin-right:20px;
    font-weight:600;
  }
  .hero{
    padding:80px 0;
    text-align:center;
    background:#e8f4ff;
  }
  .hero h1{
    margin:0;
    font-size:3rem;
    color:#0a66c2;
  }
  .hero p{
    font-size:1.25rem;
    color:#555;
    margin-top:10px;
  }
  section{
    padding:60px 0;
  }
  h2{
    font-size:2rem;
    color:#0a66c2;
    margin-bottom:20px;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
  }
  .card{
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    transition:transform .2s;
  }
  .card:hover{
