name: Telegram Autonomous Poller

on:
  schedule:
    - cron: '*/10 * * * *' # Checks Telegram every 10 minutes
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'Research Task'
        required: false
        default: 'General Research'

permissions:
  contents: write

jobs:
  poll-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir groq requests duckduckgo_search

      - name: Run Telegram Poller Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_poller.py
