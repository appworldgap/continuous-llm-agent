- name: Run Research Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TASK_PROMPT: ${{ github.event.inputs.task_prompt || 'Latest breakthroughs in technology' }}
        run: |
          python -c '
          import os, sys, subprocess
          from groq import Groq
          from duckduckgo_search import DDGS

          prompt = os.getenv("TASK_PROMPT")
          print(f"🚀 Running research agent for: {prompt}")

          # 1. Search Web
          results_text = ""
          try:
              with DDGS() as ddgs:
                  for r in ddgs.text(prompt, max_results=4):
                      title = r.get("title", "")
                      body = r.get("body", "")
                      href = r.get("href", "")
                      results_text += f"Title: {title}\nSnippet: {body}\nURL: {href}\n\n"
          except Exception as e:
              results_text = "Search failed."

          # 2. Generate HTML via Groq
          client = Groq(api_key=os.getenv("GROQ_API_KEY"))
          stream = client.chat.completions.create(
              model="llama-3.3-70b-versatile",
              messages=[
                  {"role": "system", "content": "You are an expert web researcher. Generate a clean, modern, beautifully styled standalone HTML file with embedded CSS inside ```html ... ``` code blocks."},
                  {"role": "user", "content": f"Research Topic: {prompt}\n\nSearch Results:\n{results_text}"}
              ],
              stream=True,
          )

          full_response = ""
          for chunk in stream:
              content = chunk.choices[0].delta.content or ""
              sys.stdout.write(content)
              sys.stdout.flush()
              full_response += content

          try:
              html_code = full_response.split("```html")[1].split("```")[0].strip()
          except Exception:
              html_code = f"<html><body><h1>{prompt}</h1><p>{full_response}</p></body></html>"

          # 3. Save & Push
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html_code)

          subprocess.run(["git", "config", "--global", "user.name", "github-actions[bot]"])
          subprocess.run(["git", "config", "--global", "user.email", "github-actions[bot]@users.noreply.github.com"])
          subprocess.run(["git", "add", "index.html"])
          subprocess.run(["git", "commit", "-m", f"🌐 Report for: {prompt[:30]}"])
          subprocess.run(["git", "push"])
          print("✅ Done and pushed!")
          '
